<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORGAN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* 🔥 CENTRAR EL CANVAS */
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:black;
    overflow:hidden;
}

/* 🔥 CANVAS MÁS PEQUEÑO */
canvas{
    width:100vw;
    max-width:1600px;

    aspect-ratio:16/9;

    height:auto;

    display:block;
}

/* MOBILE */
#mobile-controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
    z-index: 999;
}

#mobile-controls button {
    width: 58px;
    height: 58px;
    font-size: 24px;

    background: rgba(0,0,0,0.55);

    backdrop-filter: blur(4px);
}

</style>
</head>

<body>
    <canvas></canvas>
</body>
</html>

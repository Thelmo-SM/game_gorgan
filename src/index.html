<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GORGAN</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

body {
    margin: 0;
    background: rgb(0, 0, 0);

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;
    overflow: hidden;
}

canvas {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    height: auto;

    max-width: 1500px;
    max-height: 800px;

    image-rendering: pixelated;
}
#mobile-controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
    z-index: 999;
}

#mobile-controls button {
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 50%;
    font-size: 30px;
    background: rgba(0,0,0,0.5);
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}
</style>
</head>
<body>
    <canvas></canvas>
</body>
</html>

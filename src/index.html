<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GORGAN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

/* 🔥 CENTRAR EL CANVAS */
body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:black;
}

/* 🔥 CANVAS MÁS PEQUEÑO */
canvas{
    width:85vw;
    height:85vh;

    max-width:1600px;
    max-height:900px;

    aspect-ratio:16/9;

    display:block;

    image-rendering:pixelated;

    background:black;

    border:2px solid #111;

    box-shadow:
        0 0 40px rgba(129, 13, 13, 0.288),
        0 0 120px rgba(14, 0, 0, 0.6);

    border-radius:6px;
}

/* MOBILE */
#mobile-controls {
    position: fixed;
    bottom: 20px;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    padding: 20px;
    box-sizing: border-box;
    z-index: 999;
}

#mobile-controls button {
    width: 70px;
    height: 70px;
    border: none;
    border-radius: 50%;
    font-size: 30px;
    background: rgba(0,0,0,0.5);
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
}

</style>
</head>

<body>
    <canvas></canvas>
</body>
</html>
